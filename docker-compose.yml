services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    ports:
      - "5000:5000"
    environment:
      host: redis
      port: 6379
      password: ""
      devMode: "true"
      adminPasskey: ""
      clienturl: ""
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
